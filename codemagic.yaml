workflows:
  ios-unsigned:
    name: iOS Unsigned (for sideloading)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      flutter: stable
      cocoapods: default

    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS (no codesign)
        script: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r Runner-unsigned.ipa Payload

    artifacts:
      - build/ipa/*.ipa

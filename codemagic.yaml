workflows:
  ios-unsigned:
    name: Freendex Browser iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      flutter: 3.38.4
      cocoapods: default

    scripts:

      - name: Flutter clean
        script: |
          flutter clean

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Verify iOS project
        script: |
          echo "=== iOS directory ==="
          ls -la ios

          echo "=== Podfile ==="
          cat ios/Podfile

          echo "=== Flutter Generated.xcconfig ==="
          cat ios/Flutter/Generated.xcconfig

      - name: Install CocoaPods
        script: |
          cd ios
          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock

          pod install --repo-update

          echo "=== Pods ==="
          ls -la Pods

          echo "=== Podfile.lock ==="
          ls -la Podfile.lock

      - name: Build iOS
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        script: |
          set -e

          mkdir -p build/ipa/Payload

          cp -R \
            build/DerivedData/Build/Products/Release-iphoneos/Runner.app \
            build/ipa/Payload/

          cd build/ipa

          zip -r Runner-unsigned.ipa Payload

          echo "=== IPA ==="
          ls -lh Runner-unsigned.ipa

    artifacts:
      - build/ipa/*.ipa